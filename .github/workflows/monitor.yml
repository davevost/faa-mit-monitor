name: FAA MIT monitor

on:
  schedule:
    # Approximately every 15 minutes, offset to avoid the busiest minutes.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test notification only (do not check FAA)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: faa-mit-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Check FAA or send notification test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEND_TEST: ${{ inputs.send_test }}
        run: |
          if [ "$SEND_TEST" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi

      - name: Save duplicate-alert state
        if: ${{ inputs.send_test != true }}
        run: |
          if [ -f mit_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mit_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update FAA MIT alert state [skip ci]"
              git push
            fi
          fi
